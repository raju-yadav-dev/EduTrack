name: Build and Release APK

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Build Signed Release APK
        env:
          EDUTRACK_KEYSTORE_BASE64: ${{ secrets.EDUTRACK_KEYSTORE_BASE64 }}
          EDUTRACK_KEYSTORE_PASSWORD: ${{ secrets.EDUTRACK_KEYSTORE_PASSWORD }}
          EDUTRACK_KEY_ALIAS: ${{ secrets.EDUTRACK_KEY_ALIAS }}
          EDUTRACK_KEY_PASSWORD: ${{ secrets.EDUTRACK_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK is signed
        run: |
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "Unsigned APK generated. Check signing secrets."
            exit 1
          fi
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "Signed APK not found."
            exit 1
          fi

      - name: Rename APK
        run: |
          VERSION="${{ github.ref_name }}"
          if [ "${VERSION#v}" = "${VERSION}" ]; then
            VERSION="v${VERSION}"
          fi
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/EduTrack-release-${VERSION}.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduTrack-release
          path: app/build/outputs/apk/release/EduTrack-release-*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/EduTrack-release-*.apk