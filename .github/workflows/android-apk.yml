name: Build and Release APK

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Build APK
        env:
          EDUTRACK_KEYSTORE_BASE64: ${{ secrets.EDUTRACK_KEYSTORE_BASE64 }}
          EDUTRACK_KEYSTORE_PASSWORD: ${{ secrets.EDUTRACK_KEYSTORE_PASSWORD }}
          EDUTRACK_KEY_ALIAS: ${{ secrets.EDUTRACK_KEY_ALIAS }}
          EDUTRACK_KEY_PASSWORD: ${{ secrets.EDUTRACK_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Verify release APK is signed
        run: |
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "Unsigned release APK generated. Check signing secrets."
            exit 1
          fi
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "Signed release APK not found."
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduTrack-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduTrack-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Get latest release tag
        if: github.ref == 'refs/heads/main'
        id: latest_release
        uses: actions/github-script@v7
        with:
          script: |
            const latest = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            core.setOutput('tag_name', latest.data.tag_name);

      - name: Add APK to latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.latest_release.outputs.tag_name }}
          files: |
            app/build/outputs/apk/release/app-release.apk

      - name: Add APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
